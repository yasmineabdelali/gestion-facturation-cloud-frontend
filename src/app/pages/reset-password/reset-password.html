<div class="auth-wrapper">
  <div class="auth-content">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-4">Nouveau mot de passe</h3>
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" required minlength="6" />
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmer le mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required />
          </div>

          @if (message()) {
            <div class="alert alert-success">{{ message() }} Redirection vers la connexion...</div>
          }
          @if (errorMessage()) {
            <div class="alert alert-danger">{{ errorMessage() }}</div>
          }

          <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading() || !token">
            @if (isLoading()) { Réinitialisation... } @else { Réinitialiser le mot de passe }
          </button>
        </form>
        <div class="text-center mt-3">
          <a routerLink="/login">Retour à la connexion</a>
        </div>
      </div>
    </div>
  </div>
</div>
