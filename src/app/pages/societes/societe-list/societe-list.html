<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Sociétés</h5>
        <button class="btn btn-primary btn-sm" (click)="openCreateModal()">
          <i class="feather icon-plus"></i> Nouvelle société
        </button>
      </div>
      <div class="card-body">
        @if (isLoading()) {
          <p>Chargement...</p>
        } @else {
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Contact</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              @for (societe of societes(); track societe.id) {
                <tr>
                  <td>
                 <a [routerLink]="['/societes', societe.id]" class="text-primary fw-medium">
                 {{ societe.nom }}
                   </a>
                  </td>
                  <td>{{ societe.telephone }}</td>
                  <td>{{ societe.email }}</td>
                  <td>{{ societe.personne_contact || '-' }}</td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(societe)">
                      <i class="feather icon-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" (click)="deleteSociete(societe)">
                      <i class="feather icon-trash-2"></i>
                    </button>
                  </td>
                </tr>
              } @empty {
                <tr>
                  <td colspan="5" class="text-center">Aucune société</td>
                </tr>
              }
            </tbody>
          </table>
        }
      </div>
    </div>
  </div>
</div>
